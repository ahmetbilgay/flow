version: "2"
run:
  tests: true
linters:
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - (*encoding/json.Encoder).Encode
        - (io.Closer).Close
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
